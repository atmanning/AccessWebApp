# nginx site for Access Web: put in /etc/nginx/sites-available/access-web, link it into sites-enabled,
# replace access.example.com, then run:  sudo certbot --nginx -d access.example.com
server {
    listen 80;
    listen [::]:80;
    server_name access.example.com;

    # Access database uploads can be up to 100 MB.
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exports and imports of large databases can take a while.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
